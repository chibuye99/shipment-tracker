name: Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/shipment-tracker

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/shipment-tracker:${{ github.sha }}"
            SHORT_SHA="${GITHUB_SHA::7}"

            echo "Deploying $IMAGE"

            # Pull the new image
            docker pull "$IMAGE"

            # Capture the currently running image for rollback
            PREVIOUS_IMAGE=$(docker inspect --format='{{.Config.Image}}' shipment-tracker 2>/dev/null || echo "")

            # Stop and remove the old container (if it exists)
            docker stop shipment-tracker 2>/dev/null || true
            docker rm shipment-tracker 2>/dev/null || true

            # Start the new container
            docker run -d \
              --name shipment-tracker \
              --restart unless-stopped \
              -p 5000:5000 \
              -e FLASK_ENV=production \
              -e PORT=5000 \
              "$IMAGE"

            # Wait for health check
            echo "Waiting for health check..."
            for i in {1..15}; do
              if curl -sf http://localhost:5000/health > /dev/null; then
                echo "Health check passed"
                exit 0
              fi
              sleep 2
            done

            # If we get here, health check failed. Roll back.
            echo "Health check failed. Rolling back..."
            docker stop shipment-tracker || true
            docker rm shipment-tracker || true

            if [ -n "$PREVIOUS_IMAGE" ]; then
              docker run -d \
                --name shipment-tracker \
                --restart unless-stopped \
                -p 5000:5000 \
                -e FLASK_ENV=production \
                -e PORT=5000 \
                "$PREVIOUS_IMAGE"
              echo "Rolled back to $PREVIOUS_IMAGE"
            else
              echo "No previous image to roll back to"
            fi
            exit 1